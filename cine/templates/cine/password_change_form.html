{% extends "cine/base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Cambiar contraseña</h1>
  <form method="post" class="form">{% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }} {{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>
    {% endfor %}
    {% for error in form.non_field_errors %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endfor %}
    <button class="btn" type="submit">Guardar contraseña</button>
  </form>
</section>
{% endblock %}
